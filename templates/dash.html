<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🔥 FireDetect Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00796b;
      --secondary: #00bfa5;
      --text-color: #fff;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #004d40, #26a69a);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .dashboard {
      text-align: center;
      width: 100%;
      max-width: 1100px;
      padding: 30px;
    }

    .dashboard h1 {
      font-size: 2.3rem;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .card-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--glass-bg);
      border-radius: 20px;
      width: 280px;
      height: 200px;
      backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease, background 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      background: rgba(255,255,255,0.2);
    }

    .card .icon {
      font-size: 50px;
      margin-bottom: 15px;
      transition: transform 0.3s;
    }

    .card:hover .icon {
      transform: scale(1.2);
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .card p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      width: 100%;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Glow animation */
    @keyframes glow {
      0% { box-shadow: 0 0 5px #00bfa5, 0 0 10px #00bfa5; }
      50% { box-shadow: 0 0 20px #00bfa5, 0 0 40px #00bfa5; }
      100% { box-shadow: 0 0 5px #00bfa5, 0 0 10px #00bfa5; }
    }

    .card:hover {
      animation: glow 1.5s infinite alternate;
    }

    @media (max-width: 900px) {
      .card-container {
        flex-direction: column;
        gap: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>🔥 AI Fire Detection Dashboard</h1>

    <div class="card-container">
      <!-- Card 1 -->
      <a href="index.html" class="card">
        <div class="icon">📹</div>
        <h2>Main System</h2>
        <p>View Real-Time Detection</p>
      </a>

      <!-- Card 2 -->
      <a href="log.html" class="card">
        <div class="icon">📋</div>
        <h2>Detection Logs</h2>
        <p>View Fire History</p>
      </a>

      <!-- Card 3 -->
      <a href="help.html" class="card">
        <div class="icon">❓</div>
        <h2>Help Center</h2>
        <p>Get Support & Info</p>
      </a>
    </div>
  </div>

  <footer>© 2025 FireDetect AI — Smart Fire Safety System</footer>
</body>
</html>
