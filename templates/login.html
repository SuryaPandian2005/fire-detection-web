<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🔐 Login - Fire Detection System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --main-color: #00796b;
      --bg-gradient: linear-gradient(135deg, #e0f7fa, #ffffff);
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: 0.3s ease;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      width: 380px;
      padding: 40px 30px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container h1 {
      color: var(--main-color);
      font-size: 1.8rem;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .login-container p {
      color: #555;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--main-color);
      outline: none;
    }

    .btn {
      background: var(--main-color);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .btn:hover {
      background: #004d40;
      transform: scale(1.05);
    }

    .extra-links {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .extra-links a {
      color: var(--main-color);
      text-decoration: none;
      font-weight: 500;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* Optional Dark Mode */
    body.dark-mode {
      background: #121212;
      color: #e0e0e0;
    }
    body.dark-mode .login-container {
      background: rgba(30,30,30,0.7);
      color: #e0e0e0;
    }
    body.dark-mode input {
      background: #333;
      color: white;
      border-color: #555;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>🔥 FireDetect Login</h1>
    <p>Welcome back! Please sign in to continue.</p>

    <div class="input-group">
      <label for="username">👤 Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="input-group">
      <label for="password">🔑 Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <button class="btn" onclick="login()">Login</button>

    <div class="extra-links">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don’t have an account? <a href="#">Register</a></p>
    </div>
  </div>

  <footer>🚨 AI-Powered Fire Detection System — Secure Login</footer>

  <script>
    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === "" || password === "") {
        alert("⚠️ Please enter both username and password!");
        return;
      }

      // 🔐 Sample Login (no backend)
      if (username === "admin" && password === "1234") {
        alert("✅ Login successful!");
        window.location.href = "dash.html"; // Redirect to dashboard
      } else {
        alert("❌ Invalid username or password!");
      }
    }

    // Optional: Toggle dark mode with keyboard shortcut "D"
    document.addEventListener("keydown", e => {
      if (e.key.toLowerCase() === "d") document.body.classList.toggle("dark-mode");
    });
  </script>

</body>
</html>
